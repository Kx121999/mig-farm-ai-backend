<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>MIG FARM AI — Knowledge Admin</title>
<style>
:root{--green:#075b35;--green2:#0b7344;--ink:#173326;--muted:#6f8178;--line:#dfe9e2;--bg:#f4f8f5;--card:#fff;--gold:#f4c64e;--danger:#b42318;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:var(--bg);color:var(--ink)}
.top{background:linear-gradient(135deg,#064e2f,#0b7344);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10;box-shadow:0 8px 25px #17332620}
.topin{max-width:1220px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:14px;background:var(--gold);color:#064e2f;font-weight:900;display:grid;place-items:center;font-size:20px}
.title{font-weight:900;font-size:20px}.sub{font-size:12px;opacity:.8;margin-top:4px}.spacer{flex:1}.badge{padding:7px 10px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff28;font-size:12px}
.wrap{max-width:1220px;margin:22px auto;padding:0 16px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}
.panel,.main{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #1733260b}
.panel{padding:16px;height:max-content;position:sticky;top:104px}.main{padding:20px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:#f6faf7;border:1px solid var(--line);padding:12px;border-radius:13px}.kv{font-size:20px;font-weight:900;color:var(--green)}.kl{font-size:11px;color:var(--muted);margin-top:4px}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #cfddd3;border-radius:11px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}textarea{min-height:96px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#70a98a;box-shadow:0 0 0 3px #0b734414}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#eef6f0;color:var(--green);border:1px solid #d6e6da}.danger{background:#fff0ef;color:var(--danger);border:1px solid #f5c9c5}.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1!important}
.notice{border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:12px}.notice.info{background:#eef7f1;color:#1f5f3c}.notice.warn{background:#fff8df;color:#7b5700}.notice.err{background:#fff1f0;color:#922b21}
.toolbar{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:19px}.toolbar .grow{min-width:160px}
.entry{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;background:#fff}.entryhead{display:flex;gap:8px;align-items:center}.entryhead strong{font-size:14px}.chip{font-size:10px;border-radius:999px;padding:5px 8px;background:#eef6f0;color:var(--green);font-weight:800}.chip.warn{background:#fff5d9;color:#8a6100}.chip.off{background:#f2f2f2;color:#777}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:6px;font-size:12px}.check input{width:auto}
.empty{text-align:center;padding:55px 15px;color:var(--muted)}.small{font-size:11px;color:var(--muted)}.sep{height:1px;background:var(--line);margin:15px 0}
.login{max-width:440px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px #17332616}.login h1{margin:0 0 4px;font-size:22px}.hidden{display:none!important}
.version{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.version strong{font-size:12px}.version .small{margin-top:3px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.panel{position:static}.fields{grid-template-columns:1fr}.topin{align-items:flex-start}.badge{display:none}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="logo">AI</div><div><div class="title">MIG FARM AI — Knowledge Admin</div><div class="sub">إدارة معرفة المساعد بدون تعديل الكود</div></div><div class="spacer"></div><span class="badge" id="topStatus">غير متصل</span></div></div>

<div id="loginView" class="login">
<h1>دخول الإدارة</h1><div class="small">التوكن لا يتم إرساله لأي مكان غير API الخاص بمشروعك.</div>
<label>Admin Token</label><input id="tokenInput" type="password" autocomplete="off" placeholder="MIG_ADMIN_TOKEN"/>
<label>اسم المحرر</label><input id="userInput" placeholder="مثال: Karim"/>
<div class="row" style="margin-top:14px"><button class="primary grow" id="loginBtn">دخول</button></div>
<div id="loginMsg"></div>
</div>

<div id="appView" class="wrap hidden">
<div class="grid">
<aside class="panel">
<div class="kpi">
<div class="k"><div class="kv" id="kEntries">0</div><div class="kl">معلومة</div></div>
<div class="k"><div class="kv" id="kRev">0</div><div class="kl">Revision</div></div>
</div>
<div class="sep"></div>
<div class="small">التخزين</div><div style="font-weight:900;margin-top:4px" id="persistence">—</div>
<div class="small" style="margin-top:9px">آخر تحديث</div><div style="font-size:12px;margin-top:4px" id="updatedAt">—</div>
<div id="storageWarn"></div>
<div class="sep"></div>
<button class="primary" style="width:100%" id="saveBtn">حفظ ونشر المعرفة</button>
<button class="secondary" style="width:100%;margin-top:8px" id="validateBtn">فحص قبل الحفظ</button>
<button class="ghost" style="width:100%;margin-top:8px" id="exportBtn">Export JSON</button>
<label style="margin-top:8px" class="ghost">
<span style="display:block;text-align:center;cursor:pointer">Import JSON</span>
<input id="importInput" type="file" accept="application/json" class="hidden"/>
</label>
<div class="sep"></div>
<strong style="font-size:13px">الإصدارات السابقة</strong>
<div id="versions" style="margin-top:9px"></div>
</aside>

<main class="main">
<div class="toolbar">
<h2>قاعدة المعرفة</h2><div class="grow"></div>
<select id="filterType" style="width:auto"><option value="">كل الأنواع</option><option value="faq">FAQ</option><option value="fact">Fact</option><option value="policy">Policy</option><option value="service">Service</option><option value="notice">Notice</option></select>
<input id="searchInput" style="width:220px" placeholder="بحث..."/>
<button class="primary" id="addBtn">+ إضافة معلومة</button>
</div>
<div id="messages"></div>
<div id="entries"></div>
</main>
</div>
</div>

<script>
(function(){
'use strict';
var token='',user='',doc=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token,'x-mig-admin-user':user||'admin'}}
async function api(path,options){
  var r=await fetch('/api/knowledge'+path,Object.assign({headers:headers(),cache:'no-store'},options||{}));
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function msg(text,type){
  $('messages').innerHTML=text?'<div class="notice '+(type||'info')+'">'+esc(text)+'</div>':'';
}
function uuid(){return 'kb-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function newEntry(){return{id:uuid(),type:'faq',category:'general',title:'',question:'',content:'',answer:'',keywords:[],locale:'ar',enabled:true,priority:10,verified:false,safety_approved:false,source_label:'',source_url:'',notes:''}}
function normalizeEntry(e){e=e||{};e.keywords=Array.isArray(e.keywords)?e.keywords:[];return e}
function updateKpi(status){
 $('kEntries').textContent=doc&&doc.entries?doc.entries.length:0;
 $('kRev').textContent=doc&&doc.revision||0;
 $('persistence').textContent=status&&status.persistence||'—';
 $('updatedAt').textContent=doc&&doc.updated_at?new Date(doc.updated_at).toLocaleString('ar-AE'):'—';
 var runtime=(status&&status.persistence)==='runtime';
 $('storageWarn').innerHTML=runtime?'<div class="notice warn">⚠️ التخزين Runtime فقط. التعديلات قد تضيع مع Cold Start. اربط Redis قبل الاعتماد على اللوحة في Production.</div>':'<div class="notice info">✓ التخزين دائم ومتاح عبر Redis.</div>';
 $('topStatus').textContent='متصل • '+(status&&status.persistence||'unknown');
}
function render(){
 var type=$('filterType').value,q=$('searchInput').value.trim().toLowerCase();
 var list=(doc.entries||[]).map(normalizeEntry).filter(function(e){
   if(type&&e.type!==type)return false;
   if(q&&!JSON.stringify(e).toLowerCase().includes(q))return false;
   return true;
 });
 if(!list.length){$('entries').innerHTML='<div class="empty">لا توجد معلومات مطابقة.<br><button class="primary" style="margin-top:12px" onclick="document.getElementById(\\'addBtn\\').click()">أضف أول معلومة</button></div>';return}
 $('entries').innerHTML=list.map(function(e){
  var idx=doc.entries.indexOf(e);
  return '<section class="entry" data-id="'+esc(e.id)+'">'+
   '<div class="entryhead"><strong>'+(esc(e.title||e.question)||'معلومة جديدة')+'</strong><span class="chip">'+esc(e.type)+'</span>'+(e.verified?'<span class="chip">Verified</span>':'<span class="chip warn">غير موثقة</span>')+(!e.enabled?'<span class="chip off">معطلة</span>':'')+'<div class="grow"></div><button class="danger" data-del="'+idx+'">حذف</button></div>'+
   '<div class="fields">'+
   '<div><label>النوع</label><select data-f="type" data-i="'+idx+'"><option '+(e.type==='faq'?'selected':'')+' value="faq">FAQ</option><option '+(e.type==='fact'?'selected':'')+' value="fact">Fact</option><option '+(e.type==='policy'?'selected':'')+' value="policy">Policy</option><option '+(e.type==='service'?'selected':'')+' value="service">Service</option><option '+(e.type==='notice'?'selected':'')+' value="notice">Notice</option></select></div>'+
   '<div><label>القسم</label><input data-f="category" data-i="'+idx+'" value="'+esc(e.category||'general')+'"/></div>'+
   '<div class="full"><label>العنوان</label><input data-f="title" data-i="'+idx+'" value="'+esc(e.title||'')+'" placeholder="مثال: الشحن داخل الإمارات"/></div>'+
   '<div class="full"><label>السؤال الشائع</label><input data-f="question" data-i="'+idx+'" value="'+esc(e.question||'')+'" placeholder="مثال: عندكم شحن للعين؟"/></div>'+
   '<div class="full"><label>الإجابة</label><textarea data-f="answer" data-i="'+idx+'" placeholder="الإجابة التي سيستخدمها المساعد">'+esc(e.answer||e.content||'')+'</textarea></div>'+
   '<div class="full"><label>Keywords مفصولة بفاصلة</label><input data-f="keywords" data-i="'+idx+'" value="'+esc((e.keywords||[]).join(', '))+'" placeholder="شحن, توصيل, العين"/></div>'+
   '<div><label>Priority</label><input type="number" data-f="priority" data-i="'+idx+'" value="'+Number(e.priority||10)+'"/></div>'+
   '<div><label>اللغة</label><select data-f="locale" data-i="'+idx+'"><option value="ar" '+(e.locale!=='en'?'selected':'')+'>العربية</option><option value="en" '+(e.locale==='en'?'selected':'')+'>English</option></select></div>'+
   '<div class="full row"><label class="check"><input type="checkbox" data-f="enabled" data-i="'+idx+'" '+(e.enabled!==false?'checked':'')+'/> مفعلة</label><label class="check"><input type="checkbox" data-f="verified" data-i="'+idx+'" '+(e.verified?'checked':'')+'/> Verified</label><label class="check"><input type="checkbox" data-f="safety_approved" data-i="'+idx+'" '+(e.safety_approved?'checked':'')+'/> Safety Approved</label></div>'+
   '<div><label>اسم المصدر</label><input data-f="source_label" data-i="'+idx+'" value="'+esc(e.source_label||'')+'" placeholder="MIG FARM"/></div>'+
   '<div><label>رابط المصدر</label><input data-f="source_url" data-i="'+idx+'" value="'+esc(e.source_url||'')+'"/></div>'+
   '<div class="full"><label>ملاحظات داخلية</label><textarea data-f="notes" data-i="'+idx+'">'+esc(e.notes||'')+'</textarea></div>'+
   '</div></section>'
 }).join('');
 document.querySelectorAll('[data-f]').forEach(function(el){
  el.addEventListener('input',function(){
   var i=Number(el.dataset.i),f=el.dataset.f,v;
   if(el.type==='checkbox')v=el.checked;else if(f==='priority')v=Number(el.value)||0;else if(f==='keywords')v=el.value.split(',').map(function(x){return x.trim()}).filter(Boolean);else v=el.value;
   doc.entries[i][f]=v;
   if(f==='answer')doc.entries[i].content=v;
  });
 });
 document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(confirm('حذف المعلومة؟')){doc.entries.splice(Number(b.dataset.del),1);render();updateKpi({persistence:$('persistence').textContent})}}});
}
async function versions(){
 try{
  var j=await api('?action=versions&limit=8');
  $('versions').innerHTML=(j.versions||[]).map(function(v){
   return '<div class="version"><strong>Revision '+v.revision+'</strong><div class="small">'+esc(v.updated_at||'')+' • '+v.entries_count+' معلومة</div><button class="secondary" style="margin-top:6px;padding:6px 8px" data-roll="'+v.revision+'">Rollback</button></div>'
  }).join('')||'<div class="small">لا توجد نسخ سابقة.</div>';
  document.querySelectorAll('[data-roll]').forEach(function(b){b.onclick=async function(){if(!confirm('الرجوع إلى Revision '+b.dataset.roll+'؟'))return;try{var r=await api('',{method:'POST',body:JSON.stringify({action:'rollback',revision:Number(b.dataset.roll),updated_by:user})});doc=r.doc;msg('تم الـRollback والحفظ.','info');render();updateKpi({persistence:r.persistence});await versions()}catch(e){msg(e.message,'err')}}});
 }catch(e){$('versions').innerHTML='<div class="small">'+esc(e.message)+'</div>'}
}
async function load(){
 var j=await api('?action=get');doc=j.doc;updateKpi(j.status);render();await versions();msg('');
}
$('loginBtn').onclick=async function(){
 token=$('tokenInput').value.trim();user=$('userInput').value.trim()||'admin';
 if(!token)return;
 try{await load();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}catch(e){$('loginMsg').innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}
};
$('addBtn').onclick=function(){doc.entries.unshift(newEntry());render();window.scrollTo({top:0,behavior:'smooth'})};
$('filterType').onchange=render;$('searchInput').oninput=render;
$('validateBtn').onclick=async function(){try{var j=await api('',{method:'POST',body:JSON.stringify({action:'validate',doc:doc})});msg(j.warnings&&j.warnings.length?('الفحص ناجح مع تحذيرات: '+j.warnings.join(' | ')):'الفحص ناجح ✓',j.warnings&&j.warnings.length?'warn':'info')}catch(e){msg(e.message,'err')}};
$('saveBtn').onclick=async function(){
 try{
  var j=await api('',{method:'POST',body:JSON.stringify({action:'save',doc:doc,updated_by:user})});
  doc=j.doc;render();updateKpi({persistence:j.persistence});await versions();
  msg(j.warnings&&j.warnings.length?('تم الحفظ مع تحذيرات: '+j.warnings.join(' | ')):'تم الحفظ والنشر ✓',j.warnings&&j.warnings.length?'warn':'info');
 }catch(e){msg(e.message,'err')}
};
$('exportBtn').onclick=function(){var blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mig-farm-knowledge-rev-'+(doc.revision||0)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},500)};
$('importInput').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{doc=JSON.parse(r.result);doc.entries=Array.isArray(doc.entries)?doc.entries:[];render();msg('تم تحميل JSON. اضغط فحص ثم حفظ.','info')}catch(e){msg('JSON غير صالح','err')}};r.readAsText(f)};
})();
</script>
</body>
</html>
